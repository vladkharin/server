name: Messenger Backend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy-to-server:
    name: 🚀 Deploy Backend to VPS (PM2)
    runs-on: ubuntu-latest

    steps:
      - name: 📡 SSH Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Deploying Messenger Backend..."
            cd ~/projects/messenger-backend || exit 1
            git fetch --all
            git reset --hard origin/master
            npm install
            npm run prisma:push
            npm run build
            pm2 restart messenger-server
            echo "✅ Messenger Backend deployed successfully!"
