name: Messenger Backend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build Backend on GitHub & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: 🛠️ Build NestJS (on GitHub Actions 16GB RAM)
        run: |
          npm run build
          tar -czf backend-build.tar.gz dist prisma package.json package-lock.json

      - name: 🚚 Transfer Archive to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend-build.tar.gz"
          target: "~/projects/messenger-backend"
          overwrite: true

      - name: 🔄 Extract, Migrate DB & Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/projects/messenger-backend || exit 1
            tar -xzf backend-build.tar.gz
            rm -f backend-build.tar.gz
            npm install --production --prefer-offline || true
            npx prisma generate || true
            npx prisma db push --skip-generate || true
            pm2 restart messenger-server || pm2 start dist/main.js --name "messenger-server"
            echo "✅ Messenger Backend deployed successfully!"
