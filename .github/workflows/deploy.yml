name: Deploy Messenger Backend

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_USER }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:$HOME/.local/bin

            cd ~/projects/messenger-backend
            git fetch origin master
            git reset --hard origin/master
            npm install
            npm run build
            pm2 restart messenger-server || pm2 start dist/main.js --name messenger-server
