name: Messenger Backend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build Backend on GitHub & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: 🛠️ Build NestJS (on GitHub Actions 16GB RAM)
        run: |
          npm run build
          tar -czf backend-build.tar.gz dist prisma package.json package-lock.json

      - name: 🚚 Transfer & Deploy via Native SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass

          # 1. Создаем папку на сервере если нет
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "mkdir -p ~/projects/messenger-backend"

          # 2. Быстро передаем компактный архив
          sshpass -e scp -o StrictHostKeyChecking=no -P $PORT backend-build.tar.gz $USER@$HOST:~/projects/messenger-backend/

          # 3. Распаковываем, накатываем БД и перезапускаем PM2
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            cd ~/projects/messenger-backend &&
            tar -xzf backend-build.tar.gz &&
            rm -f backend-build.tar.gz &&
            npm install --production --prefer-offline || true &&
            npx prisma generate || true &&
            npx prisma db push --skip-generate || true &&
            pm2 restart messenger-server || pm2 start dist/main.js --name 'messenger-server' &&
            echo '✅ Messenger Backend deployed successfully!'
          "
