name: Messenger Backend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build Backend on GitHub & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: 🛠️ Build NestJS (on GitHub Actions 16GB RAM)
        run: |
          npm run build
          tar -czf backend-build.tar.gz dist prisma package.json package-lock.json

      - name: 🚚 Stream & Deploy to VPS over SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          USER: ${{ secrets.SERVER_USER || secrets.VPS_USER }}
          PORT: ${{ secrets.SERVER_PORT || secrets.VPS_PORT || 22 }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass

          # Прямая передача через SSH pipe в tar
          cat backend-build.tar.gz | sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            mkdir -p ~/projects/messenger-backend &&
            cd ~/projects/messenger-backend &&
            tar -xzf - &&
            npm install --production --prefer-offline || true &&
            npx prisma generate || true &&
            npx prisma db push --accept-data-loss --skip-generate || true &&
            (pm2 reload messenger-server || pm2 restart messenger-server || pm2 start dist/main.js --name 'messenger-server' -f) &&
            pm2 save || true &&
            echo '✅ Messenger Backend deployed successfully!'
          "
